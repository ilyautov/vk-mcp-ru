[project]
name = "vk-mcp-ru"
version = "0.2.1"
description = "VK API для ИИ-ассистентов: товары магазина сообщества, посты, рекламные кампании и статистика, диалоги с клиентами, лид-формы"
keywords = ["mcp", "model-context-protocol", "vk", "vkontakte", "vk-api", "smm", "ads", "russia", "claude"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ilya Utov" }]
dependencies = [
    # Ядро живёт отдельным пакетом: пять серверов делят его, а не копируют.
    "schema-mcp-core>=0.2.0,<1",
]

[project.urls]
Homepage = "https://business-mcp-ru.aifrontier.tech/"
Documentation = "https://business-mcp-ru.aifrontier.tech/vk-api.html"
Repository = "https://github.com/ilyautov/vk-mcp-ru"
Issues = "https://github.com/ilyautov/vk-mcp-ru/issues"
Changelog = "https://github.com/ilyautov/vk-mcp-ru/blob/main/CHANGELOG.md"

[project.scripts]
vk-mcp-ru = "vk_mcp.server:cli"
vk-mcp = "vk_mcp.server:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vk_mcp"]

[tool.setuptools.package-data]
vk_mcp = ["endpoints.yaml", "entities.yaml"]
